name: Security

on:
  pull_request:
  push:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  credentials:
    name: Credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        run: bash scripts/security/install-gitleaks.sh "$RUNNER_TEMP/security-bin"
      - name: Verify credential detection
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-bin/gitleaks
        run: python3 -m unittest discover -s scripts/security -p 'test_*.py'
      - name: Scan current files and full history
        env:
          GITLEAKS_BIN: ${{ runner.temp }}/security-bin/gitleaks
        run: bash scripts/security/scan-secrets.sh

  dependencies:
    name: Dependency and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: table
          skip-dirs: node_modules,dist,dist-ssr
          version: v0.69.3

  code:
    name: Code security scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          upload: false
          output: ${{ runner.temp }}/codeql-results
      - name: Block code security findings
        run: python3 scripts/security/check-codeql.py "$RUNNER_TEMP/codeql-results"

  gate:
    name: Security gate
    if: always()
    needs: [credentials, dependencies, code]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all scans to succeed
        env:
          CREDENTIALS: ${{ needs.credentials.result }}
          DEPENDENCIES: ${{ needs.dependencies.result }}
          CODE: ${{ needs.code.result }}
        run: |
          test "$CREDENTIALS" = success
          test "$DEPENDENCIES" = success
          test "$CODE" = success